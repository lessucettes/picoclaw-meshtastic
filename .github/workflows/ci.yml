name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.13
          cache: false
      - name: Verify generated patch and clean PicoClaw integration
        run: ./scripts/verify.sh
